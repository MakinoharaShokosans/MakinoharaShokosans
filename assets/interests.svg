<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="100%" height="280" fill="none">
  <defs>
    <style>
      /* 动效：极简声波微动 */
      @keyframes waveSlide {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      /* 动效：智能体节点呼吸点 */
      @keyframes nodePulse {
        0%, 100% { r: 3.5; opacity: 0.9; }
        50% { r: 5.5; opacity: 0.4; }
      }
      /* 动效：等轴测几何立方体微呼吸 */
      @keyframes isoHover {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      .wave-line {
        stroke-dasharray: 6 3;
        animation: waveSlide 4s linear infinite;
      }
      .node-dot {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .iso-block {
        animation: isoHover 4.5s ease-in-out infinite;
      }

      .num-tag {
        font-family: "SF Mono", "Fira Code", Menlo, monospace;
        font-size: 10px;
        letter-spacing: 1.5px;
        fill: #0284c7;
        font-weight: 600;
      }
      .card-name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        fill: #0f172a;
        letter-spacing: -0.2px;
      }
      .card-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #64748b;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- ================= 01. VOXEL ARCHITECTURE (Minecraft) ================= -->
  <g transform="translate(10, 10)">
    <rect width="385" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- 纯线构：等轴测线框几何立方体 (Isometric Axonometric Cube) -->
    <g transform="translate(32, 38)" class="iso-block">
      <!-- 三面弱灰微填充 -->
      <polygon points="22,4 40,14 22,24 4,14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
      <polygon points="4,14 22,24 22,44 4,34" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.2"/>
      <polygon points="22,24 40,14 40,34 22,44" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
      <!-- 坐标系轴线 -->
      <line x1="22" y1="4" x2="22" y2="0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="40" y1="34" x2="46" y2="38" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <text x="88" y="36" class="num-tag">01 // VOXEL &amp; MODDING</text>
    <text x="88" y="58" class="card-name">Minecraft Engineering</text>
    <text x="88" y="80" class="card-sub">整合包探索 · Java/Fabric 原生机制重构</text>
    <text x="88" y="98" class="card-sub">在三维体素网格中实现自定规则与工程逻辑</text>
  </g>

  <!-- ================= 02. GRAPH TOPOLOGY (AI & Agent) ================= -->
  <g transform="translate(425, 10)">
    <rect width="385" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 纯线构：拓扑有向图与中枢节点 (DAG Neural Graph) -->
    <g transform="translate(32, 36)">
      <circle cx="22" cy="22" r="18" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>
      <!-- 连接拓扑 -->
      <line x1="10" y1="12" x2="22" y2="22" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="10" y1="32" x2="22" y2="22" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="22" y1="22" x2="36" y2="22" stroke="#0284c7" stroke-width="1.4"/>
      <!-- 节点点位 -->
      <circle cx="10" cy="12" r="2.5" fill="#64748b"/>
      <circle cx="10" cy="32" r="2.5" fill="#64748b"/>
      <circle cx="22" cy="22" r="4.5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="36" cy="22" class="node-dot" r="4" fill="#0284c7"/>
    </g>

    <text x="88" y="36" class="num-tag">02 // AUTONOMOUS SYSTEMS</text>
    <text x="88" y="58" class="card-name">AI &amp; Agent Architectures</text>
    <text x="88" y="80" class="card-sub">大语言模型工作流 · 混合检索增强 (RAG)</text>
    <text x="88" y="98" class="card-sub">沙箱代码隔离与自循环代码演化系统</text>
  </g>

  <!-- ================= 03. EDITORIAL NARRATIVE (ACG & Galgame) ================= -->
  <g transform="translate(10, 150)">
    <rect width="385" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 纯线构：黄金比例视框与叙事准星 (Frame Ratio & Crosshair) -->
    <g transform="translate(32, 38)">
      <rect x="4" y="6" width="36" height="28" rx="2" stroke="#0284c7" stroke-width="1.2" fill="#f0f9ff"/>
      <line x1="14" y1="20" x2="30" y2="20" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="22" cy="20" r="2" fill="#0284c7"/>
      <!-- 角标装饰 -->
      <path d="M1 9 L1 3 L7 3" stroke="#94a3b8" stroke-width="1" fill="none"/>
      <path d="M43 31 L43 37 L37 37" stroke="#94a3b8" stroke-width="1" fill="none"/>
    </g>

    <text x="88" y="36" class="num-tag">03 // NARRATIVE &amp; ATMOSPHERE</text>
    <text x="88" y="58" class="card-name">ACG &amp; Visual Novels</text>
    <text x="88" y="80" class="card-sub">深度文本叙事 · 镜头语言与角色刻画</text>
    <text x="88" y="98" class="card-sub">在长篇 Galgame 中感知情感秩序与心境沉淀</text>
  </g>

  <!-- ================= 04. HARMONIC FREQUENCY (Audio & Music) ================= -->
  <g transform="translate(425, 150)">
    <rect width="385" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 纯线构：连续谐波正弦曲线与坐标轴 (Sine Waveform DSP) -->
    <g transform="translate(30, 36)">
      <!-- 坐标基准轴 -->
      <line x1="4" y1="20" x2="44" y2="20" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="8" y1="6" x2="8" y2="34" stroke="#e2e8f0" stroke-width="1"/>
      <!-- 连续正弦矢量线（流动虚线动效） -->
      <path class="wave-line" d="M8 20 Q16 4 24 20 T40 20" fill="none" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="24" cy="20" r="2" fill="#38bdf8"/>
    </g>

    <text x="88" y="36" class="num-tag">04 // ACOUSTIC SIGNAL</text>
    <text x="88" y="58" class="card-name">DSP &amp; Audiophile Sound</text>
    <text x="88" y="80" class="card-sub">硬件级 Bit-Perfect 直通 · 双耳跨馈算法</text>
    <text x="88" y="98" class="card-sub">对声音质感、频响曲线与纯净信号的偏执</text>
  </g>
</svg>
