<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="170" fill="none">
  <defs>
    <style>
      /* 动效：纯粹微妙的呼吸与律动，克制不刺眼 */
      @keyframes softPulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes waveDrift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      .anim-pulse {
        animation: softPulse 4s ease-in-out infinite;
        transform-origin: 20px 20px;
      }
      .anim-wave {
        stroke-dasharray: 4 2;
        animation: waveDrift 3s linear infinite;
      }

      /* GitHub 原生 Primer 字体体系 */
      .primer-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #1f2328; /* Primer fg.default */
        letter-spacing: -0.1px;
      }
      .primer-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #656d76; /* Primer fg.muted */
        letter-spacing: 0.1px;
      }
    </style>
  </defs>

  <!-- ================= 01. Minecraft / Voxel Modding ================= -->
  <g transform="translate(10, 10)">
    <!-- GitHub 风格圆角底衬 (无外边框，同色系冰蓝浅底) -->
    <rect width="40" height="40" rx="10" fill="#ddf4ff"/>
    <!-- Octicon 风格 3D 等轴测立方体 -->
    <g transform="translate(8, 8)">
      <path d="M12 2.5L20.5 7.4V17.2L12 22.1L3.5 17.2V7.4L12 2.5Z" stroke="#0969da" stroke-width="1.6" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.35"/>
      <path d="M12 12.3L20.5 7.4M12 12.3L3.5 7.4M12 12.3V22.1" stroke="#0969da" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <text x="56" y="20" class="primer-title">Minecraft &amp; Modding</text>
    <text x="56" y="38" class="primer-desc">整合包探索 · Java / Fabric 机制拓展与体素逻辑重构</text>
  </g>

  <!-- ================= 02. AI & Autonomous Agents ================= -->
  <g transform="translate(420, 10)">
    <rect width="40" height="40" rx="10" fill="#ddf4ff"/>
    <!-- Octicon 风格 Copilot 星芒 / 智能体中枢 -->
    <g transform="translate(8, 8)" class="anim-pulse">
      <path d="M12 3C12 7.5 8 11.5 3 12C8 12.5 12 16.5 12 21C12 16.5 16 12.5 21 12C16 11.5 12 7.5 12 3Z" stroke="#0969da" stroke-width="1.6" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.4"/>
      <circle cx="18" cy="6" r="1.8" fill="#0969da"/>
    </g>

    <text x="56" y="20" class="primer-title">AI &amp; Autonomous Agents</text>
    <text x="56" y="38" class="primer-desc">大模型工作流 · 混合检索增强 (RAG) 与沙箱代码自愈</text>
  </g>

  <!-- ================= 03. ACG & Visual Novels ================= -->
  <g transform="translate(10, 95)">
    <rect width="40" height="40" rx="10" fill="#ddf4ff"/>
    <!-- Octicon 风格 典雅书页 / 视觉小说漫游 -->
    <g transform="translate(8, 8)">
      <path d="M4 19.5V5A2.5 2.5 0 0 1 6.5 2.5H20V20.5H6.5A2.5 2.5 0 0 1 4 19.5Z" stroke="#0969da" stroke-width="1.6" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.35"/>
      <path d="M8 7.5H16M8 11.5H13" stroke="#0969da" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <text x="56" y="20" class="primer-title">Anime &amp; Visual Novels</text>
    <text x="56" y="38" class="primer-desc">细腻叙事 · 长篇 Galgame 沉浸与角色心境沉淀</text>
  </g>

  <!-- ================= 04. Audiophile & DSP ================= -->
  <g transform="translate(420, 95)">
    <rect width="40" height="40" rx="10" fill="#ddf4ff"/>
    <!-- Octicon 风格 纯净脉冲声波 / 硬件直通 -->
    <g transform="translate(8, 8)">
      <circle cx="12" cy="12" r="8.5" stroke="#0969da" stroke-width="1.4" stroke-opacity="0.4"/>
      <path class="anim-wave" d="M5 12H7.5L9.5 7L13 17L15.5 10L17.5 12H19" stroke="#0969da" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <text x="56" y="20" class="primer-title">Audiophile &amp; Sound DSP</text>
    <text x="56" y="38" class="primer-desc">Bit-Perfect 硬件直通 · 双耳跨馈与声音质感偏执</text>
  </g>
</svg>
