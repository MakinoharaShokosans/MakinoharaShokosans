<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="200" fill="none">
  <defs>
    <!-- 浅色背景温润渐变：柔白、天空浅蓝与樱粉的微风感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>

    <!-- 装饰光斑渐变 -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes gentleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.08); }
      }
      @keyframes shimmerLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .floating {
        animation: gentleFloat 5s ease-in-out infinite;
      }
      .pulsing-blue {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 720px 60px;
      }
      .pulsing-pink {
        animation: pulseGlow 7s ease-in-out infinite reverse;
        transform-origin: 120px 140px;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        fill: #0f172a;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        fill: #64748b;
        letter-spacing: 0.3px;
      }
      .tag-text {
        font-family: "SF Mono", "Fira Code", Menlo, monospace;
        font-weight: 500;
        fill: #0284c7;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- 边框与圆角底板 -->
  <rect x="1" y="1" width="838" height="198" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- 背景动态柔和光晕 -->
  <circle class="pulsing-blue" cx="720" cy="60" r="140" fill="url(#orbGlow)"/>
  <circle class="pulsing-pink" cx="120" cy="140" r="120" fill="url(#orbGlowPink)"/>

  <!-- 装饰性几何细线 -->
  <line x1="40" y1="160" x2="800" y2="160" stroke="#f1f5f9" stroke-width="1"/>
  <circle cx="80" cy="40" r="2.5" fill="#94a3b8" opacity="0.4"/>
  <circle cx="95" cy="40" r="1.5" fill="#94a3b8" opacity="0.3"/>
  <circle cx="750" cy="140" r="2" fill="#cbd5e1"/>

  <!-- 主体内容 -->
  <g class="floating">
    <!-- 极简胶囊标签 -->
    <rect x="52" y="38" width="132" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.8"/>
    <circle cx="64" cy="50" r="3.5" fill="#0284c7"/>
    <text x="75" y="54" class="tag-text">DIGITAL ATELIER</text>

    <!-- 姓名主标题 -->
    <text x="50" y="98" class="title-text" font-size="30">Makinohara Shoko</text>

    <!-- 个人属性副标题 -->
    <text x="52" y="128" class="sub-text" font-size="14.5">
      Minecraft Modding · Autonomous Agents · ACG &amp; Galgame · Audiophile
    </text>
  </g>

  <!-- 右侧极简矢量罗盘/音律微构图 -->
  <g transform="translate(730, 95)" opacity="0.85">
    <circle cx="0" cy="0" r="36" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="0" cy="0" r="24" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M-12 0 L12 0 M0 -12 L0 12" stroke="#0ea5e9" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#0284c7"/>
  </g>
</svg>
