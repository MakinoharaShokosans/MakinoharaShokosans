<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="100%" height="140" fill="none">
  <defs>
    <style>
      /* 动效 1：MC 体素立方体浮动 */
      @keyframes voxelHover {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3.5px); }
      }
      .anim-voxel {
        animation: voxelHover 3s ease-in-out infinite;
      }

      /* 动效 2：AI 核心脉冲 + 卫星环绕 */
      @keyframes coreBreathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes orbitSpin {
        0% { transform: rotate(0deg) translate(8.5px) rotate(0deg); }
        100% { transform: rotate(360deg) translate(8.5px) rotate(-360deg); }
      }
      .anim-core {
        animation: coreBreathe 2.6s ease-in-out infinite;
        transform-origin: 10px 10px;
      }
      .anim-satellite {
        animation: orbitSpin 4.5s linear infinite;
        transform-origin: 10px 10px;
      }

      /* 动效 3：小说书签丝带微风摇摆 */
      @keyframes ribbonSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-5deg); }
      }
      .anim-ribbon {
        animation: ribbonSway 3.8s ease-in-out infinite;
        transform-origin: 10px 3px;
      }

      /* 动效 4：音频跳动频谱柱 (4 柱真实动态均衡器) */
      @keyframes bar1 { 0%, 100% { height: 5px; y: 13px; } 50% { height: 13px; y: 5px; } }
      @keyframes bar2 { 0%, 100% { height: 14px; y: 4px; } 50% { height: 6px; y: 12px; } }
      @keyframes bar3 { 0%, 100% { height: 8px; y: 10px; } 50% { height: 16px; y: 2px; } }
      @keyframes bar4 { 0%, 100% { height: 12px; y: 6px; } 50% { height: 5px; y: 13px; } }
      .eq-b1 { animation: bar1 1.0s ease-in-out infinite; }
      .eq-b2 { animation: bar2 0.8s ease-in-out infinite 0.15s; }
      .eq-b3 { animation: bar3 1.2s ease-in-out infinite 0.05s; }
      .eq-b4 { animation: bar4 0.9s ease-in-out infinite 0.25s; }

      .p-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #1f2328;
      }
      .p-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #656d76;
      }
    </style>
  </defs>

  <!-- ================= 01. Minecraft / Voxel Modding ================= -->
  <g transform="translate(15, 12)">
    <rect width="36" height="36" rx="9" fill="#ddf4ff"/>
    <!-- 带有连续浮动动效的等轴测立方体 -->
    <g transform="translate(8, 8)" class="anim-voxel">
      <path d="M10 2.5L17.5 6.8V15.2L10 19.5L2.5 15.2V6.8L10 2.5Z" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.3"/>
      <path d="M10 11L17.5 6.8M10 11L2.5 6.8M10 11V19.5" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <text x="50" y="18" class="p-title">Minecraft &amp; Modding</text>
    <text x="50" y="34" class="p-desc">整合包探索 · Java / Fabric 机制与体素逻辑重构</text>
  </g>

  <!-- ================= 02. AI & Autonomous Agents ================= -->
  <g transform="translate(400, 12)">
    <rect width="36" height="36" rx="9" fill="#ddf4ff"/>
    <!-- 带有卫星轨道自转与核心呼吸的智能体中枢 -->
    <g transform="translate(8, 8)">
      <path class="anim-core" d="M10 2C10 6 6 10 2 10C6 10 10 14 10 18C10 14 14 10 18 10C14 10 10 6 10 2Z" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.4"/>
      <circle class="anim-satellite" cx="10" cy="10" r="1.6" fill="#0969da"/>
    </g>
    <text x="50" y="18" class="p-title">AI &amp; Autonomous Agents</text>
    <text x="50" y="34" class="p-desc">大模型工作流 · 混合检索增强 (RAG) 与沙箱自愈</text>
  </g>

  <!-- ================= 03. Anime & Visual Novels ================= -->
  <g transform="translate(15, 80)">
    <rect width="36" height="36" rx="9" fill="#ddf4ff"/>
    <!-- 带有微风摇摆动效的视觉小说书页 -->
    <g transform="translate(8, 8)" class="anim-ribbon">
      <path d="M3.5 17V4C3.5 2.9 4.4 2 5.5 2H16.5V18H5.5C4.4 18 3.5 17.1 3.5 17Z" stroke="#0969da" stroke-width="1.5" fill="#b6e3ff" fill-opacity="0.3"/>
      <path d="M6.5 6H13.5M6.5 9.5H11" stroke="#0969da" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="50" y="18" class="p-title">Anime &amp; Visual Novels</text>
    <text x="50" y="34" class="p-desc">细腻叙事 · 长篇 Galgame 沉浸与角色心境沉淀</text>
  </g>

  <!-- ================= 04. Audiophile & DSP ================= -->
  <g transform="translate(400, 80)">
    <rect width="36" height="36" rx="9" fill="#ddf4ff"/>
    <!-- 带有真实跳动均衡器声波柱的音频模块 -->
    <g transform="translate(8, 8)">
      <circle cx="10" cy="10" r="8.5" stroke="#0969da" stroke-width="1.3" stroke-opacity="0.25"/>
      <g transform="translate(1.5, 0)">
        <rect class="eq-b1" x="3" y="10" width="2" height="7" rx="1" fill="#0969da"/>
        <rect class="eq-b2" x="7" y="6" width="2" height="11" rx="1" fill="#0969da"/>
        <rect class="eq-b3" x="11" y="4" width="2" height="13" rx="1" fill="#0969da"/>
        <rect class="eq-b4" x="15" y="8" width="2" height="9" rx="1" fill="#0969da"/>
      </g>
    </g>
    <text x="50" y="18" class="p-title">Audiophile &amp; Sound DSP</text>
    <text x="50" y="34" class="p-desc">Bit-Perfect 硬件直通 · 实时均衡与音频质感偏执</text>
  </g>
</svg>
