<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="100%" height="140" fill="none">
  <defs>
    <style>
      /* 动效 1：MC 体素立方体浮动 (严格基于中心微动，绝不位移底色框) */
      @keyframes voxelHover {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }
      .anim-voxel {
        animation: voxelHover 2.8s ease-in-out infinite;
      }

      /* 动效 2：AI 核心脉冲 + 卫星公转 */
      @keyframes coreBreathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes orbitSpin {
        0% { transform: rotate(0deg) translate(8px) rotate(0deg); }
        100% { transform: rotate(360deg) translate(8px) rotate(-360deg); }
      }
      .anim-core {
        animation: coreBreathe 2.4s ease-in-out infinite;
        transform-origin: 0px 0px;
      }
      .anim-satellite {
        animation: orbitSpin 4.2s linear infinite;
        transform-origin: 0px 0px;
      }

      /* 动效 3：视觉小说书签微摆 */
      @keyframes ribbonSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-4deg); }
      }
      .anim-ribbon {
        animation: ribbonSway 3.6s ease-in-out infinite;
        transform-origin: 0px -8px;
      }

      /* 动效 4：音频跳动频谱柱 (4 柱真实动态均衡器，严格居中) */
      @keyframes bar1 { 0%, 100% { height: 4px; y: -2px; } 50% { height: 11px; y: -5.5px; } }
      @keyframes bar2 { 0%, 100% { height: 12px; y: -6px; } 50% { height: 5px; y: -2.5px; } }
      @keyframes bar3 { 0%, 100% { height: 6px; y: -3px; } 50% { height: 14px; y: -7px; } }
      @keyframes bar4 { 0%, 100% { height: 10px; y: -5px; } 50% { height: 4px; y: -2px; } }
      .eq-b1 { animation: bar1 0.9s ease-in-out infinite; }
      .eq-b2 { animation: bar2 0.75s ease-in-out infinite 0.15s; }
      .eq-b3 { animation: bar3 1.1s ease-in-out infinite 0.05s; }
      .eq-b4 { animation: bar4 0.85s ease-in-out infinite 0.25s; }

      .p-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #1f2328;
      }
      .p-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #656d76;
      }
    </style>
  </defs>

  <!-- ================= 01. Minecraft / Voxel Modding ================= -->
  <g transform="translate(15, 12)">
    <!-- 浅蓝圆角底色块 (36x36，几何中心在 18, 18) -->
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#ddf4ff"/>
    
    <!-- 独立定位容器，绝对中心 (18, 18) -->
    <g transform="translate(18, 18)">
      <g class="anim-voxel">
        <polygon points="0,-8.5 7.5,-4.2 0,0 -7.5,-4.2" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.35"/>
        <polygon points="-7.5,-4.2 0,0 0,8.5 -7.5,4.2" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.2"/>
        <polygon points="0,0 7.5,-4.2 7.5,4.2 0,8.5" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.45"/>
      </g>
    </g>

    <text x="50" y="18" class="p-title">Minecraft &amp; Modding</text>
    <text x="50" y="34" class="p-desc">整合包探索 · Java / Fabric 机制与体素逻辑重构</text>
  </g>

  <!-- ================= 02. AI & Autonomous Agents ================= -->
  <g transform="translate(400, 12)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#ddf4ff"/>
    
    <g transform="translate(18, 18)">
      <path class="anim-core" d="M0 -8.5C0 -4 -4 0 -8.5 0C-4 0 0 4 0 8.5C0 4 4 0 8.5 0C4 0 0 -4 0 -8.5Z" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.4"/>
      <circle class="anim-satellite" cx="0" cy="0" r="1.6" fill="#0969da"/>
    </g>

    <text x="50" y="18" class="p-title">AI &amp; Autonomous Agents</text>
    <text x="50" y="34" class="p-desc">大模型工作流 · 混合检索增强 (RAG) 与沙箱自愈</text>
  </g>

  <!-- ================= 03. Anime & Visual Novels ================= -->
  <g transform="translate(15, 80)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#ddf4ff"/>
    
    <g transform="translate(18, 18)">
      <g class="anim-ribbon">
        <path d="M-6.5 -8.5H5A2 2 0 0 1 7 -6.5V7A2 2 0 0 1 5 9H-6.5C-7.3 9 -8 8.3 -8 7.5V-7C-8 -7.8 -7.3 -8.5 -6.5 -8.5Z" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.3"/>
        <line x1="-4" y1="-3.5" x2="3.5" y2="-3.5" stroke="#0969da" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="-4" y1="0.5" x2="1" y2="0.5" stroke="#0969da" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>

    <text x="50" y="18" class="p-title">Anime &amp; Visual Novels</text>
    <text x="50" y="34" class="p-desc">细腻叙事 · 长篇 Galgame 沉浸与角色心境沉淀</text>
  </g>

  <!-- ================= 04. Audiophile & DSP ================= -->
  <g transform="translate(400, 80)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="#ddf4ff"/>
    
    <g transform="translate(18, 18)">
      <circle cx="0" cy="0" r="8" stroke="#0969da" stroke-width="1.2" stroke-opacity="0.25"/>
      <!-- 4 柱对称跳动均衡器，完美锚定中心 -->
      <rect class="eq-b1" x="-6.25" y="-3" width="2" height="6" rx="1" fill="#0969da"/>
      <rect class="eq-b2" x="-2.75" y="-5" width="2" height="10" rx="1" fill="#0969da"/>
      <rect class="eq-b3" x="0.75" y="-6" width="2" height="12" rx="1" fill="#0969da"/>
      <rect class="eq-b4" x="4.25" y="-4" width="2" height="8" rx="1" fill="#0969da"/>
    </g>

    <text x="50" y="18" class="p-title">Audiophile &amp; Sound DSP</text>
    <text x="50" y="34" class="p-desc">Bit-Perfect 硬件直通 · 实时均衡与音频质感偏执</text>
  </g>
</svg>
