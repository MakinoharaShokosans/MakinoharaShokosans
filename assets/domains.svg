<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="100%" height="140" fill="none">
  <defs>
    <style>
      .p-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #1f2328;
      }
      .p-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #656d76;
      }
    </style>
  </defs>

  <!-- ================= 01. Minecraft / Voxel Modding ================= -->
  <g transform="translate(15, 12)">
    <!-- GitHub Primer 同色系浅蓝底徽章 (无卡片外框) -->
    <rect width="36" height="36" rx="9" fill="#ddf4ff"/>
    <g transform="translate(8, 8)">
      <path d="M10 2.5L17.5 6.8V15.2L10 19.5L2.5 15.2V6.8L10 2.5Z" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.3"/>
      <path d="M10 11L17.5 6.8M10 11L2.5 6.8M10 11V19.5" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <text x="50" y="18" class="p-title">Minecraft &amp; Modding</text>
    <text x="50" y="34" class="p-desc">整合包探索 · Java / Fabric 机制与体素逻辑重构</text>
  </g>

  <!-- ================= 02. AI & Autonomous Agents ================= -->
  <g transform="translate(400, 12)">
    <rect width="36" height="36" rx="9" fill="#ddf4ff"/>
    <g transform="translate(8, 8)">
      <path d="M10 2C10 6 6 10 2 10C6 10 10 14 10 18C10 14 14 10 18 10C14 10 10 6 10 2Z" stroke="#0969da" stroke-width="1.5" stroke-linejoin="round" fill="#b6e3ff" fill-opacity="0.4"/>
      <circle cx="15.5" cy="4.5" r="1.5" fill="#0969da"/>
    </g>
    <text x="50" y="18" class="p-title">AI &amp; Autonomous Agents</text>
    <text x="50" y="34" class="p-desc">大模型工作流 · 混合检索增强 (RAG) 与沙箱自愈</text>
  </g>

  <!-- ================= 03. Anime & Visual Novels ================= -->
  <g transform="translate(15, 80)">
    <rect width="36" height="36" rx="9" fill="#ddf4ff"/>
    <g transform="translate(8, 8)">
      <path d="M3.5 17V4C3.5 2.9 4.4 2 5.5 2H16.5V18H5.5C4.4 18 3.5 17.1 3.5 17Z" stroke="#0969da" stroke-width="1.5" fill="#b6e3ff" fill-opacity="0.3"/>
      <path d="M6.5 6H13.5M6.5 9.5H11" stroke="#0969da" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="50" y="18" class="p-title">Anime &amp; Visual Novels</text>
    <text x="50" y="34" class="p-desc">细腻叙事 · 长篇 Galgame 沉浸与角色心境沉淀</text>
  </g>

  <!-- ================= 04. Audiophile & DSP ================= -->
  <g transform="translate(400, 80)">
    <rect width="36" height="36" rx="9" fill="#ddf4ff"/>
    <g transform="translate(8, 8)">
      <circle cx="10" cy="10" r="7.5" stroke="#0969da" stroke-width="1.3" stroke-opacity="0.35"/>
      <path d="M3.5 10H5.5L7.5 5.5L10.5 14.5L12.5 8.5L14.5 10H16.5" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="50" y="18" class="p-title">Audiophile &amp; Sound DSP</text>
    <text x="50" y="34" class="p-desc">Bit-Perfect 硬件直通 · 双耳跨馈与声音质感偏执</text>
  </g>
</svg>
